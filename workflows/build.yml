name: Build .NET project

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DOTNET_VERSION: 10.0.x
  PROJECT_PATH: ./src/MyApp/MyApp.csproj

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Confirm runner
        shell: bash
        run: echo "Runner is ready!"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        shell: bash
        run: dotnet restore "$https://github.com/keicam-svg/warp-lab01-hello-workshop"

      - name: Build project
        shell: bash
        run: dotnet build "$https://github.com/keicam-svg/warp-lab01-hello-workshop" --configuration Release --no-restore

      - name: Run project
        shell: bash
        run: dotnet run --project "$https://github.com/keicam-svg/warp-lab01-hello-workshop" --configuration Release --no-build
